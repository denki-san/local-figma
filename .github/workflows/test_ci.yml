name: CI

# 完整回归由用户确认后手动触发，推送和小改动不自动运行全套。
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: 安装开发依赖
        run: npm ci --ignore-scripts
      - name: 语法检查
        run: npm run check
      - name: 自动测试与隔离安装验收
        run: npm test
